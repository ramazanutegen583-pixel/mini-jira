name: teamflow
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minijira
      POSTGRES_USER: minijira
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minijira"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      PORT: '8080'
      DB_URL: jdbc:postgresql://database:5432/minijira
      DB_USERNAME: minijira
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:4202:8080"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres-data:
